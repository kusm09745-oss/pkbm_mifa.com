<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087c54"><title>SIM-PKBM Minhajul Falah</title><style>
:root{--g:#087c54;--gd:#07563d;--p:#eaf7f0;--ink:#19382d;--mut:#6b7d75;--line:#e1ebe5;--bg:#f4f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e4f5eb,#f7fbf8)}.loginbox{background:white;padding:30px;border-radius:20px;width:min(420px,100%);text-align:center;box-shadow:0 15px 45px #164b3020}.logo{width:125px;height:125px;object-fit:contain}.loginbox h1{font-size:22px}.field{margin:12px 0;text-align:left}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.btn{border:0;background:var(--g);color:white;padding:10px 14px;border-radius:9px;font-weight:bold}.btn:hover{background:var(--gd)}.btn.alt{background:#eaf2ed;color:var(--ink)}.btn.red{background:#b83232}.app{display:none}.side{position:fixed;inset:0 auto 0 0;width:250px;background:white;border-right:1px solid var(--line);padding:17px 13px;overflow:auto}.brand{display:flex;align-items:center;gap:9px;padding:5px 7px 16px;border-bottom:1px solid var(--line)}.brand img{width:47px;height:47px;object-fit:contain}.brand b{font-size:12px}.nav{padding-top:12px}.nav button{display:block;width:100%;text-align:left;padding:10px;border:0;border-radius:8px;background:transparent;color:#456257;margin:2px 0}.nav button.active,.nav button:hover{background:var(--p);color:var(--g);font-weight:bold}.main{margin-left:250px;padding:25px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h2{margin:0;font-size:23px}.muted,.hint{color:var(--mut);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px}.metric{font-size:28px;font-weight:bold;color:var(--g);margin-top:8px}.panel{margin-top:15px}.panel h3{margin:0 0 13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{padding:10px;border:1px solid var(--line);border-radius:8px;min-width:210px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--mut);text-transform:uppercase}td{font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;font-size:11px}.empty{text-align:center;color:var(--mut);padding:24px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.modal{position:fixed;inset:0;background:#10271dcc;display:none;place-items:center;padding:15px;z-index:10}.modalbox{background:white;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:15px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.tag{display:inline-block;padding:4px 7px;border-radius:20px;background:var(--p);color:var(--g);font-size:11px}.photo{width:70px;height:55px;object-fit:cover;border-radius:6px}.mobilebrand{display:none}.notice{background:#fff8df;border:1px solid #f0dfa5;padding:12px;border-radius:9px;color:#66551e;margin-top:14px;line-height:1.5}@media(max-width:800px){.side{position:static;width:auto;height:auto;padding:10px}.brand{border:0;padding-bottom:7px}.nav{display:flex;overflow:auto;padding-top:4px;gap:4px}.nav button{white-space:nowrap;width:auto;font-size:12px}.main{margin:0;padding:14px}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}.top h2{font-size:19px}}

const schemas={ppdb:[['nama','Nama calon peserta didik','text',true],['nik','NIK','text'],['jk','Jenis kelamin','select','Laki-laki|Perempuan'],['tempatLahir','Tempat lahir','text'],['tanggalLahir','Tanggal lahir','date'],['alamat','Alamat','textarea'],['telepon','No. HP/WA','text'],['program','Program yang dipilih','select','Paket A|Paket B|Paket C|Kursus/Keterampilan'],['tanggalDaftar','Tanggal pendaftaran','date'],['status','Status seleksi','select','Pendaftar|Diverifikasi|Diterima|Cadangan|Ditolak'],['catatan','Catatan','textarea']],students:[['nis','NIS/NISN','text'],['nama','Nama lengkap','text',true],['nik','NIK','text'],['jk','Jenis kelamin','select','Laki-laki|Perempuan'],['tempatLahir','Tempat lahir','text'],['tanggalLahir','Tanggal lahir','date'],['agama','Agama','text'],['alamat','Alamat lengkap','textarea'],['namaAyah','Nama ayah','text'],['namaIbu','Nama ibu','text'],['teleponOrtu','HP orang tua/wali','text'],['program','Program','select','Paket A|Paket B|Paket C|Kursus/Keterampilan'],['angkatan','Tahun masuk','number'],['status','Status','select','Aktif|Lulus|Pindah|Keluar'],['asalSekolah','Asal sekolah','text'],['catatan','Keterangan','textarea']],teachers:[['nama','Nama pendidik/tutor','text',true],['nik','NIK','text'],['nuptk','NUPTK','text'],['jabatan','Jabatan','text'],['pendidikan','Pendidikan terakhir','text'],['bidang','Bidang studi','text'],['telepon','No. HP','text'],['email','Email','email'],['status','Status','select','Aktif|Tidak aktif']],programs:[['nama','Nama program','text',true],['jenis','Jenis program','select','Pendidikan Kesetaraan|Keterampilan|Keaksaraan|Pelatihan|Lainnya'],['sasaran','Sasaran peserta','text'],['tahun','Tahun pelaksanaan','number'],['jadwal','Jadwal','text'],['penanggungJawab','Penanggung jawab','text'],['anggaran','Anggaran (Rp)','number'],['status','Status','select','Rencana|Berjalan|Selesai|Ditunda'],['deskripsi','Deskripsi program','textarea']],activities:[['nama','Nama kegiatan','text',true],['tanggal','Tanggal kegiatan','date'],['lokasi','Lokasi','text'],['program','Program terkait','text'],['penanggungJawab','Penanggung jawab','text'],['peserta','Jumlah peserta','number'],['deskripsi','Uraian kegiatan','textarea'],['dokumentasi','Foto/dokumentasi (maks. 1,5 MB)','file']],attendance:[['tanggal','Tanggal','date',true],['nama','Nama peserta didik','text',true],['program','Program/kelas','text'],['status','Kehadiran','select','Hadir|Izin|Sakit|Alpa'],['keterangan','Keterangan','textarea']],grades:[['nama','Nama peserta didik','text',true],['program','Program/kelas','text'],['mataPelajaran','Mata pelajaran','text'],['semester','Semester','select','Ganjil|Genap'],['tahunAjaran','Tahun ajaran','text'],['nilai','Nilai','number'],['predikat','Predikat','text'],['catatan','Catatan tutor','textarea']],alumni:[['nama','Nama alumni','text',true],['nis','NIS/NISN','text'],['program','Program terakhir','text'],['tahunLulus','Tahun lulus','number'],['aktivitas','Kegiatan setelah lulus','text'],['telepon','No. HP','text'],['alamat','Alamat','textarea']],inventory:[['nama','Nama barang/aset','text',true],['kode','Kode inventaris','text'],['kategori','Kategori','text'],['jumlah','Jumlah','number'],['kondisi','Kondisi','select','Baik|Rusak ringan|Rusak berat'],['lokasi','Lokasi penyimpanan','text'],['tahun','Tahun perolehan','number'],['keterangan','Keterangan','textarea']],letters:[['nomor','Nomor surat','text',true],['tanggal','Tanggal surat','date'],['jenis','Jenis surat','select','Surat masuk|Surat keluar|SK|Undangan|Keterangan|Lainnya'],['perihal','Perihal','text'],['asalTujuan','Asal/tujuan surat','text'],['penanggungJawab','Penanggung jawab','text'],['catatan','Catatan','textarea']]};
const labels=Object.fromEntries(menus.map(x=>[x[0],x[2]]));let data=load(),current='dashboard',editId=null;
function blank(){let o={};for(let m of Object.keys(schemas))o[m]=[];o.settings={nama:'PKBM Minhajul Falah',alamat:'Batujaya – Karawang',npsn:'',izin:'',kepala:'',tahunAjaran:'2026/2027'};return o}
function load(){try{return {...blank(),...JSON.parse(localStorage.getItem(DBKEY)||'{}')}}catch(e){return blank()}}function save(){try{localStorage.setItem(DBKEY,JSON.stringify(data));return true}catch(e){alert('Penyimpanan penuh. Kurangi ukuran foto dokumentasi atau lakukan backup.');return false}}
function loginNow(){if(document.getElementById('username').value==='admin'&&document.getElementById('password').value==='admin123'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';renderNav();show('dashboard')}else alert('Username atau password salah.')};function logout(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid';document.getElementById('password').value=''}
function renderNav(){document.getElementById('nav').innerHTML=menus.map(m=>`<button data-page="${m[0]}" class="${current===m[0]?'active':''}" onclick="show('${m[0]}')">${m[1]} &nbsp; ${m[2]}</button>`).join('')}
function show(page){current=page;renderNav();document.getElementById('pageTitle').textContent=labels[page]||'Dashboard';if(page==='dashboard')dashboard();else if(page==='reports')reports();else if(page==='settings')settings();else tablePage(page)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){let active=data.students.filter(x=>x.status==='Aktif').length;document.getElementById('content').innerHTML=`<div class="cards">${[['Peserta didik aktif',active],['Pendaftar baru',data.ppdb.length],['Pendidik & tutor',data.teachers.length],['Program pendidikan',data.programs.length],['Kegiatan terdokumentasi',data.activities.length],['Alumni',data.alumni.length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="panel"><h3>Selamat datang di SIM-PKBM Minhajul Falah</h3><p>Kelola administrasi lembaga, peserta didik, penerimaan siswa baru, program, kegiatan, absensi, hasil belajar, alumni, inventaris, dan surat menyurat melalui menu di samping.</p><div class="actions"><button class="btn" onclick="show('ppdb')">+ Pendaftaran baru</button><button class="btn alt" onclick="show('students')">Buka Buku Induk</button><button class="btn alt" onclick="show('activities')">Dokumentasi kegiatan</button></div></div><div class="notice"><b>Penting:</b> Data saat ini tersimpan di browser/perangkat yang digunakan (localStorage). Untuk digunakan bersama oleh banyak operator/perangkat, diperlukan database online dan autentikasi server. Lakukan backup secara berkala melalui tombol Backup.</div>`}
function tablePage(page){let rows=data[page]||[],fields=schemas[page],q='';let head=fields.filter(f=>f[2]!=='textarea'&&f[2]!=='file').slice(0,5);document.getElementById('content').innerHTML=`<div class="panel"><div class="toolbar"><input id="search" placeholder="Cari data..." oninput="filterRows('${page}')"><div class="actions"><button class="btn" onclick="openForm('${page}')">+ Tambah data</button><button class="btn alt" onclick="exportCSV('${page}')">Ekspor CSV</button><button class="btn alt" onclick="window.print()">Cetak</button></div></div><div class="tablewrap"><table><thead><tr><th>No.</th>${head.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Aksi</th></tr></thead><tbody id="rows">${rowHtml(page,rows,head)}</tbody></table></div><p class="hint">Jumlah data: ${rows.length}. Data tersimpan pada browser ini.</p></div>`}
function rowHtml(page,rows,head){if(!rows.length)return `<tr><td colspan="${head.length+2}" class="empty">Belum ada data. Klik Tambah data untuk mulai mengisi.</td></tr>`;return rows.map((r,i)=>`<tr><td>${i+1}</td>${head.map(f=>`<td>${f[2]==='file'&&r[f[0]]?`<a href="${r[f[0]]}" target="_blank">Lihat foto</a>`:esc(r[f[0]])}</td>`).join('')}<td><div class="actions"><button class="btn alt small" onclick="openForm('${page}','${r.id}')">Ubah</button><button class="btn red small" onclick="del('${page}','${r.id}')">Hapus</button></div></td></tr>`).join('')}
function filterRows(page){let q=document.getElementById('search').value.toLowerCase(),rows=(data[page]||[]).filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q))),head=schemas[page].filter(f=>f[2]!=='textarea'&&f[2]!=='file').slice(0,5);document.getElementById('rows').innerHTML=rowHtml(page,rows,head)}
function openForm(page,id=null){editId=id;let item=(data[page]||[]).find(x=>x.id===id)||{};document.getElementById('modalTitle').textContent=(id?'Ubah ':'Tambah ')+labels[page];document.getElementById('formFields').innerHTML=schemas[page].map(f=>{let [k,l,t,extra]=f,v=item[k]??'';if(t==='select')return `<div class="field"><label>${esc(l)}</label><select name="${k}">${String(extra).split('|').map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;if(t==='textarea')return `<div class="field" style="grid-column:1/-1"><label>${esc(l)}</label><textarea name="${k}" rows="3">${esc(v)}</textarea></div>`;if(t==='file')return `<div class="field" style="grid-column:1/-1"><label>${esc(l)}</label><input type="file" name="${k}" accept="image/*"><input type="hidden" name="old_${k}" value="${esc(v)}">${v?'<small>Foto sudah tersimpan; pilih foto baru untuk mengganti.</small>':''}</div>`;return `<div class="field"><label>${esc(l)}</label><input name="${k}" type="${t==='number'?'number':t}" value="${esc(v)}" ${extra===true?'required':''}></div>`}).join('');document.getElementById('modal').style.display='grid';document.getElementById('dataForm').onsubmit=e=>submitForm(e,page,id)}
function closeModal(){document.getElementById('modal').style.display='none'}
function submitForm(e,page,id){e.preventDefault();let form=e.target,obj={};for(let f of schemas[page]){let el=form.elements[f[0]];if(f[2]==='file'){obj[f[0]]=form.elements['old_'+f[0]].value;let file=el.files[0];if(file){if(file.size>1.5*1024*1024){alert('Ukuran foto maksimal 1,5 MB.');return}let reader=new FileReader();reader.onload=()=>{obj[f[0]]=reader.result;finishSave(page,id,obj)};reader.readAsDataURL(file);return}}else obj[f[0]]=el.value.trim()}finishSave(page,id,obj)}
function finishSave(page,id,obj){if(id){let i=data[page].findIndex(x=>x.id===id);if(i>=0)data[page][i]={...data[page][i],...obj}}else data[page].push({id:String(Date.now())+Math.random().toString(16).slice(2),...obj});save();closeModal();show(page)}
function del(page,id){if(confirm('Yakin ingin menghapus data ini?')){data[page]=data[page].filter(x=>x.id!==id);save();show(page)}}
function exportCSV(page){let fs=schemas[page],rows=[fs.map(f=>f[1]).join(','),...(data[page]||[]).map(r=>fs.map(f=>'"'+String(f[2]==='file'?'Dokumentasi tersimpan':r[f[0]]??'').replaceAll('"','""')+'"').join(','))];download(rows.join('\n'),'data-'+page+'.csv','text/csv;charset=utf-8')}
function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backupData(){download(JSON.stringify(data,null,2),'backup-pkbm-minhajul-falah-'+new Date().toISOString().slice(0,10)+'.json','application/json')}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.ppdb)throw 0;if(confirm('Pulihkan data dari file ini? Data browser saat ini akan diganti.')){data={...blank(),...x};save();show(current);alert('Data berhasil dipulihkan.')}}catch(_){alert('File backup tidak valid.')}e.target.value=''};r.readAsText(f)}
function reports(){let keys=['ppdb','students','teachers','programs','activities','attendance','grades','alumni','inventory','letters'];document.getElementById('content').innerHTML=`<div class="panel"><h3>Rekapitulasi data lembaga</h3><div class="tablewrap"><table><thead><tr><th>Jenis data</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${labels[k]}</td><td>${data[k].length}</td><td><button class="btn alt small" onclick="show('${k}')">Lihat data</button></td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="backupData()">Unduh backup lengkap (JSON)</button><button class="btn alt" onclick="window.print()">Cetak rekap</button></div></div>`}
function settings(){let s=data.settings;document.getElementById('content').innerHTML=`<div class="panel"><h3>Identitas lembaga</h3><form id="settingsForm"><div class="formgrid">${[['nama','Nama lembaga'],['alamat','Alamat'],['npsn','NPSN'],['izin','Nomor izin operasional'],['kepala','Nama kepala/pengelola'],['tahunAjaran','Tahun ajaran aktif']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(s[k]||'')}"></div>`).join('')}</div><button class="btn">Simpan identitas</button></form></div><div class="panel"><h3>Pengaturan & keamanan</h3><p>Login demo saat ini menggunakan akun bawaan admin / admin123. Ganti password belum dapat diamankan hanya dengan HTML statis; gunakan autentikasi server untuk penggunaan resmi.</p><p class="hint">Disarankan: backup data secara rutin dan jangan gunakan komputer umum untuk menyimpan data pribadi peserta didik.</p></div>`;document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();for(let [k] of [['nama'],['alamat'],['npsn'],['izin'],['kepala'],['tahunAjaran']])data.settings[k]=e.target.elements[k].value;save();alert('Identitas lembaga disimpan.')}}
</script></body></html>
